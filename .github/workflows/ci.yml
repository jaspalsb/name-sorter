name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

#the workflow only needs to read the repository
permissions:
  contents: read

jobs:
  build-and-test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      #let both platforms finish so failures can be compared
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      - name: Build distribution packages
        run: python -m build